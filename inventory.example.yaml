# Copy to inventory.yaml and edit. Credentials are NOT stored here:
# they are read from environment variables (see .env.example).
defaults:
  device_type: cisco_ios
  port: 22

devices:
  - name: core-sw1
    host: 10.0.0.2

  - name: edge-rtr1
    host: 10.0.0.1
    device_type: cisco_xe

  - name: mikrotik-office
    host: 192.168.88.1
    device_type: mikrotik_routeros
    # use a different account just for this device
    username_env: MT_USERNAME
    password_env: MT_PASSWORD

  - name: srx-dc
    host: 10.10.0.1
    device_type: juniper_junos

  - name: custom-cmd
    host: 10.0.0.9
    device_type: cisco_ios
    command: show startup-config
